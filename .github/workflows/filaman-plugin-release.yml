name: Build and publish Filaman plugin ZIP

on:
  push:
    tags:
      - 'filaman-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#filaman-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build hosted-mode bundle
        run: npm run build
        env:
          NODE_ENV: production
          VITE_HOSTED_MODE: '1'
          VITE_BASE_PATH: '/plugins/filament-swatch/'

      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx
      - run: python -m unittest discover -s tests

      - name: Create ZIP
        run: python3 scripts/package-filaman-plugin.py "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Filaman Plugin v${{ steps.version.outputs.version }}
          body: |
            FilaMan-native discovery plugin v${{ steps.version.outputs.version }}.

            ## Installation

            1. Download `filament-swatch-${{ steps.version.outputs.version }}.zip` below
            2. In Filaman: **Admin → Plugins → Upload ZIP**
            3. "Filament Swatch" appears in the sidebar automatically

            ## Requirements

            - FilaMan native API and plugin shell; see docs/filaman-compatibility.md
            - No SpoolmanAPI plugin required
          files: filament-swatch-*.zip
