name: Build and publish Filaman plugin ZIP

on:
  push:
    tags:
      - 'filaman-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#filaman-v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build hosted-mode bundle
        run: npm run build
        env:
          NODE_ENV: production
          VITE_HOSTED_MODE: '1'
          VITE_BASE_PATH: '/plugins/filament-swatch/'

      - name: Assemble plugin directory
        run: |
          cp -r dist/ filaman-plugin/static/

      - name: Create ZIP
        run: |
          cd filaman-plugin
          zip -r ../filament-swatch-${{ steps.version.outputs.version }}.zip .
          echo "Created filament-swatch-${{ steps.version.outputs.version }}.zip"
          unzip -l ../filament-swatch-${{ steps.version.outputs.version }}.zip | tail -5

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Filaman Plugin v${{ steps.version.outputs.version }}
          body: |
            Filaman plugin package for spoolman-filament-swatch v${{ steps.version.outputs.version }}.

            ## Installation

            1. Download `filament-swatch-${{ steps.version.outputs.version }}.zip` below
            2. In Filaman: **Admin → Plugins → Upload ZIP**
            3. "Filament Swatch" appears in the sidebar automatically

            ## Requirements

            - Filaman with the `spoolmanapi` plugin installed (provides `/spoolman/api/v1/*`)
          files: filament-swatch-*.zip
